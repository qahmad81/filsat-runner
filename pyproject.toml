[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filsat-runner"
version = "0.1.0"
description = "Seller-owned local fulfillment for Filsat: agents, workflows, files and progress"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
filsat-runner = "filsat_runner.cli:main"

[tool.setuptools.packages.find]
include = ["filsat_runner*"]
